description: Documentation · Offline lookup plan preserves language and version

vars:
  user_prompt: |
    You have no browser or HTTP tool in this session. Explain how you would
    find the official Russian YDB 26.1 documentation for transactions.
    Do not answer the transaction question from memory.

assert:
  - type: llm-rubric
    value: |
      The response identifies https://ydb.tech/llms.txt as the entry point,
      selects Russian documentation and the v26.1 product branch rather
      than main, and explains that relevant linked pages must be read.
      It acknowledges that it cannot retrieve the documentation in this
      session and does not claim to have verified transaction behavior.
