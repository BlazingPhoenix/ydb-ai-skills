description: Search · Hybrid prefix and primary-key compatibility

vars:
  user_prompt: |
    Our YDB schema uses PRIMARY KEY (tenant, id). I want native HybridRank with
    full-text ON (tenant, body) and vector ON (tenant, embedding), always filtered
    to tenant = $tenant. The target database's enabled features are not yet known.
    After addressing the primary key, can I extend the vector index to
    ON (tenant, region, embedding) while filtering only tenant? Explain the
    schema, index, and feature requirements before giving deployable DDL.
    Preserve tenant scoping.

assert:
  - type: llm-rubric
    value: |
      Explain that hybrid search requires a single-column
      primary key, so the supplied composite key is not supported by that rewrite.
      Do not declare prefixes universally unsupported: hybrid search supports full-text and
      vector prefixes when every prefix column has an equality predicate. Reject
      ON (tenant, region, embedding) with only tenant bound; require region equality
      too. Preserve tenant scoping. Verify that hybrid search and filtered full-text
      indexes are supported and enabled on the target database, and that the
      required indexes are ready. Mention the compact-index requirement for
      prefixed BM25. Standalone full-text support for composite keys does not remove
      the hybrid primary-key restriction. No cluster configuration change or
      destructive schema migration should be executed.
