description: Search · Vector lifecycle and recall

vars:
  user_prompt: |
    I plan to create an empty YDB documents table with a vector_kmeans_tree
    cosine index, BulkUpsert a million 768-dimensional float embeddings, then
    query ORDER BY Knn::CosineDistance(embedding, $q) DESC LIMIT 10 without VIEW.
    The index covers only title. Fix the loading and query plan, including how
    to assess recall and handle continued writes. Write guidance only.

assert:
  - type: llm-rubric
    value: |
      The answer must load representative data before building the vector index,
      and place BulkUpsert before index creation because synchronous indexes do
      not support it. It must explain that empty-table construction produces one
      cluster and later writes do not retrain it. It must show indexed search with
      VIEW, cosine distance ascending, an explicit KMeansTreeSearchTopSize, and
      an encoded binary String query vector matching dimension 768. Covering the
      embedding as well as title avoids the vector lookup. Recall should be
      compared with an exact baseline using the same filters. Mention build-time
      write inconsistency and rebuilding when distribution changes degrade results.
