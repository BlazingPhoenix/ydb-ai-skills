description: Python audit · client FloatVector list converted in YQL (RULE-PY-01)

vars:
  user_prompt: |
    Review this YDB Python query path. The embedding is produced by the application:

    ```python
    query = '''
    DECLARE $embedding AS List<Float>;
    SELECT id FROM documents
    ORDER BY Knn::CosineDistance(
        embedding, Knn::ToBinaryStringFloat($embedding))
    LIMIT 10;
    '''
    rows = pool.execute_with_retries(query, {
        "$embedding": (embedding, ydb.ListType(ydb.PrimitiveType.Float)),
    })
    ```

assert:
  - type: llm-rubric
    value: |
      The response should cite RULE-PY-01, identify client-provided
      List<Float> plus Knn::ToBinaryStringFloat as the anti-pattern, and
      recommend little-endian Float32 bytes with a trailing 0x01 marker.
      It should bind the bytes as ydb.PrimitiveType.String, declare the
      parameter as String, and use the parameter directly in Knn::CosineDistance.
      It should not treat the YQL conversion as always wrong: it remains useful
      for a vector constructed within YQL.
